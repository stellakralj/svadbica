  if(el.dataset.ac==='pickFF'){if(!el.value)return;const it=state.hotel.myFinger.find(x=>x.id===el.dataset.id);if(it){it.text=el.value.split('::').slice(1).join('::');it.src='Hotel'}save();render();return}
  if(!el.dataset.f)return;
  if(el.type==='checkbox'||el.tagName==='SELECT'||el.dataset.c==='rooms'||el.dataset.c==='price'||(el.dataset.c==='hotel'&&(el.dataset.f==='myPrice'||el.dataset.f==='myFingerPrice'))){setField(el);render()}
  else{setField(el);if(el.dataset.num)el.value=fnum(num(el.value));softUpdate()}
});
document.addEventListener('click',e=>{const m=$('#more');if(m.open&&!e.target.closest('#more'))m.open=false});
async function importFile(el){const f=el.files[0];el.value='';if(!f)return;try{const obj=JSON.parse(await f.text());if(!obj||!Array.isArray(obj.budget)||!Array.isArray(obj.parties))throw 0;withUndo('Podaci uvezeni',()=>{state=migrate(obj)})}catch(e){toast('Ta datoteka nije kopija ovog plana.')}}
async function shrink(file,max=1400){const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.84))}finally{URL.revokeObjectURL(url)}}
async function addImages(files){files=files.filter(f=>f.type.startsWith('image/'));if(!files.length)return;toast('Dodajem slike…');const cat=state.inspo.cats.includes(ui.iFilter)?ui.iFilter:'Ostalo';let n=0;const assets=await getAssets();
  for(const f of files){let blob;try{blob=await shrink(f)}catch(e){continue}const it={id:uid(),title:f.name.replace(/\.[^.]+$/,'').slice(0,40),cat,fav:false,note:''};let ok=false;
    if(assets){try{const r=await assets.upload(blob,{type:'image/jpeg'});it.asset=r.id;it.url=r.url;ok=true}catch(e){}}
    if(!ok){try{await idb.put(it.id,blob);it.idb=true;idbUrls[it.id]=URL.createObjectURL(blob);ok=true}catch(e){}}if(ok){state.inspo.items.unshift(it);n++}}
  save();render();toast(n?(n===1?'Slika dodana':n+' slike dodane'):'Slike se nisu uspjele spremiti.')}

/* list reordering via handles */
let dragSort=null;
document.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-handle]');if(h){const row=h.closest('[data-sid]');if(row)row.draggable=true}});
document.addEventListener('dragstart',e=>{const row=e.target.closest&&e.target.closest('[data-sid]');
  if(row&&row.draggable&&e.target===row){dragSort={row,id:row.dataset.sid,cont:row.parentElement.closest('[data-sort]')};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','sort');row.classList.add('dragging')}else e.preventDefault()});
function clearMarks(){$$('.drop-before,.drop-after').forEach(x=>x.classList.remove('drop-before','drop-after'))}
document.addEventListener('dragover',e=>{if(!dragSort)return;let over=e.target.closest('[data-sid]');while(over&&over.parentElement!==dragSort.row.parentElement)over=over.parentElement&&over.parentElement.closest('[data-sid]');
  if(!over||over===dragSort.row)return;e.preventDefault();clearMarks();const b=over.getBoundingClientRect();const grid=!!over.closest('.grid-sort');const after=grid?(e.clientX>b.left+b.width/2):(e.clientY>b.top+b.height/2);
  over.classList.add(after?'drop-after':'drop-before');dragSort.target=over.dataset.sid;dragSort.after=after});
document.addEventListener('drop',e=>{if(!dragSort||!dragSort.target)return;e.preventDefault();const arr=arrFor(dragSort.cont.dataset.sort,dragSort.cont);if(arr){moveItem(arr,dragSort.id,dragSort.target,dragSort.after);save()}dragSort=null;clearMarks();render()});
document.addEventListener('dragend',()=>{if(dragSort){dragSort.row.classList.remove('dragging');dragSort.row.draggable=false}dragSort=null;clearMarks();$$('[data-sid][draggable="true"]').forEach(r=>r.draggable=false)});
function moveItem(arr,id,targetId,after){const from=arr.findIndex(x=>x.id===id);if(from<0)return;const [it]=arr.splice(from,1);const to=arr.findIndex(x=>x.id===targetId);if(to<0){arr.splice(from,0,it);return}if(it.day!==undefined&&arr[to].day!==undefined)it.day=arr[to].day;arr.splice(after?to+1:to,0,it)}

/* pointer drag: tables, dance floor, guests, rooms, dishes */
const snap=v=>Math.round(v/5)*5;
function clampT(t){t.x=Math.max(10,Math.min(FW-10,t.x));t.y=Math.max(10,Math.min(FH-10,t.y))}
document.addEventListener('pointerdown',e=>{D.swallow=false;if(e.pointerType==='mouse'&&e.button!==0)return;const src=e.target.closest('[data-pd]');if(!src)return;const btn=e.target.closest('button,input,select,textarea');if(btn&&btn!==src)return;
  D.s={kind:src.dataset.pd,ctx:src.dataset.ctx,src,x0:e.clientX,y0:e.clientY,started:false}});
document.addEventListener('pointermove',e=>{const s=D.s;if(!s)return;if(!s.started){if(Math.hypot(e.clientX-s.x0,e.clientY-s.y0)<5)return;startDrag(s)}e.preventDefault();moveDrag(s,e)},{passive:false});
document.addEventListener('pointerup',e=>{const s=D.s;D.s=null;if(!s||!s.started)return;D.swallow=true;endDrag(s,e)});
document.addEventListener('pointercancel',()=>{const s=D.s;D.s=null;if(s&&s.started){$('#ghost')&&$('#ghost').remove();$$('.dz').forEach(x=>x.classList.remove('dz'));render()}});
function startDrag(s){s.started=true;document.body.style.userSelect='none';
  if(s.kind==='item'){s.it=itemById(s.src.dataset.iid);s.el=s.src;s.ox=s.it.x;s.oy=s.it.y}
  else if(s.kind==='resize'){s.it=itemById(s.src.dataset.iid);s.el=s.src.closest('.fitem');s.ow=s.it.w;s.oh=s.it.h}
  else if(s.kind==='table'){s.el=s.src.closest('.tb');s.t=tableById(s.src.dataset.tbl);s.ox=s.t.x;s.oy=s.t.y;s.el.classList.add('dragging')}
  else if(s.kind==='dance'){s.el=s.src;const d=state.floor.dance;s.ox=d.x;s.oy=d.y}
  else{let label=s.src.dataset.label||'';if(s.kind==='party')label=target('p',s.src.dataset.pid).name;else if(s.src.dataset.mid&&!label){const [m]=findMember(s.src.dataset.mid);label=m?m.name:''}
    const g=document.createElement('div');g.id='ghost';g.textContent=label;document.body.appendChild(g);s.ghost=g}}
function dropTarget(s,x,y){const el=document.elementFromPoint(x,y);if(!el)return null;
  if(s.kind==='new'||s.kind==='newitem')return el.closest('#floor');
  if(s.ctx==='seat')return el.closest('[data-seat],[data-tbl],[data-pool="seat"]');
  if(s.ctx==='room')return el.closest('[data-room],[data-pool="room"]');
  if(s.ctx==='menu')return el.closest('[data-course-drop]')||el.closest('[data-mymenu]');
  if(s.ctx==='ff')return el.closest('[data-myff]');
  return null}
function moveDrag(s,e){
  if(s.kind==='item'){const z=ui.zCur||1;s.nx=Math.max(0,Math.min(FW-s.it.w,snap(s.ox+(e.clientX-s.x0)/z)));s.ny=Math.max(0,Math.min(FH-s.it.h,snap(s.oy+(e.clientY-s.y0)/z)));s.el.style.left=s.nx+'px';s.el.style.top=s.ny+'px';return}
  if(s.kind==='resize'){const z=ui.zCur||1;s.nw=Math.max(30,snap(s.ow+(e.clientX-s.x0)/z));s.nh=Math.max(24,snap(s.oh+(e.clientY-s.y0)/z));s.el.style.width=s.nw+'px';s.el.style.height=s.nh+'px';const sp=s.el.querySelector('.flab');if(sp)sp.style.fontSize=fitFs(s.it.label,s.nw,s.nh,s.it.shape==='round')+'px';return}
  if(s.kind==='table'||s.kind==='dance'){const z=ui.zCur||1;const nx=snap(s.ox+(e.clientX-s.x0)/z),ny=snap(s.oy+(e.clientY-s.y0)/z);
    if(s.kind==='table'){s.nx=Math.max(10,Math.min(FW-10,nx));s.ny=Math.max(10,Math.min(FH-10,ny))}else{const d=state.floor.dance;s.nx=Math.max(0,Math.min(FW-d.w,nx));s.ny=Math.max(0,Math.min(FH-d.h,ny))}
    s.el.style.left=s.nx+'px';s.el.style.top=s.ny+'px';return}
  s.ghost.style.left=e.clientX+'px';s.ghost.style.top=e.clientY+'px';
  if(e.clientY<80)window.scrollBy(0,-14);else if(e.clientY>innerHeight-70)window.scrollBy(0,14);
  const t=dropTarget(s,e.clientX,e.clientY);if(t!==s.tgt){if(s.tgt)s.tgt.classList.remove('dz');s.tgt=t;if(t&&t.id!=='floor'&&!t.hasAttribute('data-mymenu'))t.classList.add('dz')}}
function endDrag(s,e){document.body.style.userSelect='';
  if(s.kind==='item'){if(s.nx!=null){s.it.x=s.nx;s.it.y=s.ny;ui.selI=s.it.id;ui.selT=null;save()}render();return}
  if(s.kind==='resize'){if(s.nw!=null){s.it.w=s.nw;s.it.h=s.nh;save()}render();return}
  if(s.kind==='newitem'){s.ghost&&s.ghost.remove();if(!s.tgt)return;const r=$('#floor').getBoundingClientRect();const z=ui.zCur||1;const it=newItem(s.src.dataset.shape,0,0);it.x=Math.max(0,snap((e.clientX-r.left)/z-it.w/2));it.y=Math.max(0,snap((e.clientY-r.top)/z-it.h/2));ui.selI=it.id;ui.selT=null;save();render();return}
  if(s.kind==='table'){if(s.nx!=null){s.t.x=s.nx;s.t.y=s.ny;ui.selT=s.t.id;save()}render();return}
  if(s.kind==='dance'){if(s.nx!=null){state.floor.dance.x=s.nx;state.floor.dance.y=s.ny;save()}render();return}
  s.ghost&&s.ghost.remove();if(s.tgt)s.tgt.classList.remove('dz');const t=s.tgt;if(!t)return;
  if(s.kind==='new'){const r=$('#floor').getBoundingClientRect();const z=ui.zCur||1;const nt=newTable(s.src.dataset.type,snap((e.clientX-r.left)/z),snap((e.clientY-r.top)/z));clampT(nt);ui.selT=nt.id;save();render();return}
  if(s.ctx==='menu'){const course=t.dataset.courseDrop||s.src.dataset.course;
    if(s.kind==='mydish'){const it=state.hotel.myMenu.find(x=>x.id===s.src.dataset.mid);if(it&&t.dataset.courseDrop){it.course=t.dataset.courseDrop;const arr=state.hotel.myMenu;arr.splice(arr.indexOf(it),1);arr.push(it);save();render()}return}
    copyToMy(s.src.dataset.text,course,s.src.dataset.src);return}
  if(s.ctx==='ff'){state.hotel.myFinger.push({id:uid(),text:s.src.dataset.text,src:'Hotel'});save();render();return}
  if(s.ctx==='seat'){
    if(t.dataset.pool==='seat'){if(s.kind==='party')target('p',s.src.dataset.pid).members.forEach(unseat);else{const [m]=findMember(s.src.dataset.mid);m&&unseat(m)}}
    else{const tid=t.dataset.seat?t.dataset.seat.split(':')[0]:t.dataset.tbl;const idx=t.dataset.seat?+t.dataset.seat.split(':')[1]:null;
      if(s.kind==='party')placeParty(s.src.dataset.pid,tid,idx||0);else{const i=idx!=null?idx:firstFree(tid);if(i<0){toast('Stol je pun.');return}placeMember(s.src.dataset.mid,tid,i)}ui.selT=tid}
    ui.selG=null;save();render();return}
  if(s.ctx==='room'){
    if(t.dataset.pool==='room'){if(s.kind==='party')target('p',s.src.dataset.pid).members.forEach(m=>unroom(m.id));else unroom(s.src.dataset.mid)}
    else{if(s.kind==='party')placePartyInRoom(s.src.dataset.pid,t.dataset.room);else placeInRoom(s.src.dataset.mid,t.dataset.room)}
    ui.selG=null;save();render()}
}

/* ================= boot ================= */
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')A.closeModal()});
ensureFeed();render(false);updThemeBtn();setStatus('Spremljeno na uređaju');initCloud();
